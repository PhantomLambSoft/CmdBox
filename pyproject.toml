[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdbox"
version = "0.1.0"
description = "A cross-platform command manager for terminal workflows."
readme = "README.md"
authors = [
    { name = "MalloyDelacroix", email = "malloydelacroix@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "typer>=0.21.0",
    "rich>=14.0.0",
    "peewee>=3.18.3",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0.0",
    "tomlkit>=0.13.3",
    "psutil>=7.2.1",
]

[project.optional-dependencies]
dev = [
    "black>=25.0.0",
    "isort>=5.13.0",
    "ruff>=0.14.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
cb = "cmdbox.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cmdbox*"]

[tool.setuptools.package-data]
cmdbox = ["*.yaml", "*.json", "*.txt", "integrations/*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["cmdbox"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["cmdbox"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
show_error_codes = true
