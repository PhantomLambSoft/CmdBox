name: Deploy Docs

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repo
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.x"

            -   name: Install dependencies
                run: |
                    pip install mkdocs
                    pip install mkdocs-material

            -   name: Deploy to GitHub Pages
                run: mkdocs gh-deploy --force